openapi: 3.0.0
info:
  title: Multischool ID Card System API
  description: API documentation for the backend authentication and authorization system.
  version: 1.0.0
servers:
  - url: http://localhost:5000/api/v1
    description: Development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - name
                - email
                - mobile
                - password
                - role
              properties:
                username:
                  type: string
                name:
                  type: string
                email:
                  type: string
                mobile:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum: [SUPERADMIN, SCHOOLADMIN, TEACHER]
                schoolId:
                  type: string
      responses:
        '201':
          description: Registration successful
  /auth/login:
    post:
      summary: User login
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identifier
                - password
              properties:
                identifier:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
  /auth/me:
    get:
      summary: Get current authenticated user details
      tags:
        - Authentication
      responses:
        '200':
          description: User details
        '401':
          description: Unauthorized
  /schools:
    get:
      summary: Get all schools
      tags:
        - Schools
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
      responses:
        '200':
          description: A list of schools
    post:
      summary: Create a new school
      tags:
        - Schools
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - schoolName
                - boardType
                - schoolType
                - email
                - phone
                - addressLine1
                - city
                - state
                - postalCode
              properties:
                schoolName:
                  type: string
                boardType:
                  type: string
                schoolType:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                addressLine1:
                  type: string
                city:
                  type: string
                state:
                  type: string
                postalCode:
                  type: string
                logo:
                  type: string
                  format: binary
      responses:
        '201':
          description: School created successfully
  /schools/{id}:
    get:
      summary: Get a school by ID
      tags:
        - Schools
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: School details
    put:
      summary: Update a school
      tags:
        - Schools
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: School updated successfully
    delete:
      summary: Soft delete a school
      tags:
        - Schools
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: School deleted successfully
  /schools/{id}/status:
    patch:
      summary: Update school status
      tags:
        - Schools
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
      responses:
        '200':
          description: Status updated
  /schools/{id}/assign-admin:
    patch:
      summary: Assign an admin to a school
      tags:
        - Schools
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: string
      responses:
        '200':
          description: Admin assigned
  /students:
    get:
      summary: Get all students for the authenticated school
      tags:
        - Students
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: classId
          schema:
            type: string
      responses:
        '200':
          description: List of students
    post:
      summary: Create a new student
      tags:
        - Students
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - admissionNumber
                - studentName
                - gender
                - dateOfBirth
              properties:
                admissionNumber:
                  type: string
                studentName:
                  type: string
                gender:
                  type: string
                dateOfBirth:
                  type: string
                  format: date
      responses:
        '201':
          description: Student created
  /students/{id}:
    get:
      summary: Get student by ID
      tags:
        - Students
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Student details
    put:
      summary: Update student
      tags:
        - Students
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Student updated
    delete:
      summary: Soft delete a student
      tags:
        - Students
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Student deleted
  /students/{id}/photo:
    post:
      summary: Upload student photo
      tags:
        - Students
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Photo uploaded
  /students/import:
    post:
      summary: Bulk import students from Excel
      tags:
        - Students
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - sessionId
              properties:
                file:
                  type: string
                  format: binary
                sessionId:
                  type: string
      responses:
        '200':
          description: Import processed
  /students/export:
    get:
      summary: Export students to Excel
      tags:
        - Students
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Excel file buffer
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
  /students/promote:
    post:
      summary: Bulk promote students to new class/session
      tags:
        - Students
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - studentIds
                - newSessionId
              properties:
                studentIds:
                  type: array
                  items:
                    type: string
                newSessionId:
                  type: string
                newClassId:
                  type: string
      responses:
        '200':
          description: Promotion success
  /teachers:
    get:
      summary: Get all teachers for the authenticated school
      tags:
        - Teachers
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: department
          schema:
            type: string
        - in: query
          name: designation
          schema:
            type: string
      responses:
        '200':
          description: List of teachers
    post:
      summary: Create a new teacher
      tags:
        - Teachers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - employeeId
                - teacherCode
                - fullName
                - gender
                - dateOfBirth
                - email
                - mobile
              properties:
                employeeId:
                  type: string
                teacherCode:
                  type: string
                fullName:
                  type: string
                email:
                  type: string
                  format: email
                mobile:
                  type: string
                gender:
                  type: string
                dateOfBirth:
                  type: string
                  format: date
                designation:
                  type: string
      responses:
        '201':
          description: Teacher created
  /teachers/{id}:
    get:
      summary: Get teacher by ID
      tags:
        - Teachers
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Teacher details
    put:
      summary: Update teacher
      tags:
        - Teachers
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Teacher updated
    delete:
      summary: Soft delete a teacher
      tags:
        - Teachers
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Teacher deleted
  /teachers/{id}/photo:
    post:
      summary: Upload teacher photo
      tags:
        - Teachers
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Photo uploaded
  /teachers/{id}/signature:
    post:
      summary: Upload teacher signature
      tags:
        - Teachers
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                signature:
                  type: string
                  format: binary
      responses:
        '200':
          description: Signature uploaded
  /teachers/import:
    post:
      summary: Bulk import teachers from Excel
      tags:
        - Teachers
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Import processed
  /teachers/export:
    get:
      summary: Export teachers to Excel
      tags:
        - Teachers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Excel file buffer
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
  /teachers/{id}/assign-class:
    patch:
      summary: Assign a class to a teacher
      tags:
        - Teachers
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - classId
              properties:
                classId:
                  type: string
      responses:
        '200':
          description: Class assigned
  /teachers/{id}/remove-class:
    patch:
      summary: Remove class assignment from a teacher
      tags:
        - Teachers
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Class assignment removed
  /teachers/{id}/reset-password:
    patch:
      summary: Reset teacher password
      tags:
        - Teachers
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - newPassword
              properties:
                newPassword:
                  type: string
      responses:
        '200':
          description: Password reset successfully


  /sessions:
    post:
      summary: Create a new session
      tags:
        - Sessions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionName: { type: string }
                sessionCode: { type: string }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                academicYear: { type: string }
      responses:
        '201': { description: Session created successfully }
    get:
      summary: Get all sessions
      tags:
        - Sessions
      security:
        - bearerAuth: []
      responses:
        '200': { description: List of sessions }
  /sessions/{id}:
    get:
      summary: Get session by ID
      tags:
        - Sessions
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Session details }
    put:
      summary: Update a session
      tags:
        - Sessions
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Session updated }
    delete:
      summary: Delete a session
      tags:
        - Sessions
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Session deleted }
  /sessions/{id}/activate:
    patch:
      summary: Activate a session
      tags:
        - Sessions
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Session activated }
  /sessions/{id}/archive:
    patch:
      summary: Archive a session
      tags:
        - Sessions
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Session archived }
  /classes:
    post:
      summary: Create a new class
      tags:
        - Classes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId: { type: string }
                className: { type: string }
                classCode: { type: string }
                classNumericValue: { type: number }
                capacity: { type: number }
      responses:
        '201': { description: Class created successfully }
    get:
      summary: Get all classes
      tags:
        - Classes
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        '200': { description: List of classes }
  /classes/{id}:
    get:
      summary: Get class by ID
      tags:
        - Classes
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Class details }
    put:
      summary: Update a class
      tags:
        - Classes
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Class updated }
    delete:
      summary: Delete a class
      tags:
        - Classes
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Class deleted }
  /classes/{id}/assign-teacher:
    patch:
      summary: Assign teacher to a class
      tags:
        - Classes
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                teacherId: { type: string }
      responses:
        '200': { description: Teacher assigned }
  /classes/{id}/remove-teacher:
    patch:
      summary: Remove teacher from a class
      tags:
        - Classes
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Teacher removed }
  /classes/{id}/students:
    get:
      summary: Get students in a class
      tags:
        - Classes
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Students list }
  /classes/{id}/statistics:
    get:
      summary: Get class statistics
      tags:
        - Classes
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Class stats }
  /sections:
    post:
      summary: Create a new section
      tags:
        - Sections
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId: { type: string }
                classId: { type: string }
                sectionName: { type: string }
                sectionCode: { type: string }
      responses:
        '201': { description: Section created }
    get:
      summary: Get all sections
      tags:
        - Sections
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: sessionId
          required: true
          schema: { type: string }
        - in: query
          name: classId
          required: true
          schema: { type: string }
      responses:
        '200': { description: List of sections }
  /sections/{id}:
    get:
      summary: Get section by ID
      tags:
        - Sections
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Section details }
    put:
      summary: Update a section
      tags:
        - Sections
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Section updated }
    delete:
      summary: Delete a section
      tags:
        - Sections
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Section deleted }
  /promotions/student:
    post:
      summary: Promote a single student
      tags:
        - Promotions
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200': { description: Student promoted }
  /promotions/batch:
    post:
      summary: Promote a batch of students
      tags:
        - Promotions
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200': { description: Batch promoted }
  /promotions/rollback:
    post:
      summary: Rollback a promotion batch
      tags:
        - Promotions
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                batchPromotionId: { type: string }
      responses:
        '200': { description: Rollback successful }
  /promotions/history:
    get:
      summary: Get promotion history
      tags:
        - Promotions
      security:
        - bearerAuth: []
      responses:
        '200': { description: Promotion history }
  /dashboard/stats:
    get:
      summary: Get dashboard statistics for a session
      tags:
        - Dashboard
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Dashboard stats }
